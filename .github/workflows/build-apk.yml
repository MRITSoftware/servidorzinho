name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Install Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle
        
    - name: Copy files to assets
      run: |
        mkdir -p android/app/src/main/assets
        cp servidor_auto.py android/app/src/main/assets/
        cp iniciar_auto.sh android/app/src/main/assets/
        cp parar.sh android/app/src/main/assets/
        cp INSTALAR_AUTO.sh android/app/src/main/assets/
        cp setup_boot.sh android/app/src/main/assets/
        cp requirements.txt android/app/src/main/assets/
        
    - name: Grant execute permission
      run: chmod +x android/app/src/main/assets/*.sh
      
    - name: Create Gradle wrapper
      working-directory: android
      run: |
        gradle wrapper --gradle-version 8.5
        
    - name: Build APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

