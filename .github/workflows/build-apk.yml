name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.9'
        
    - name: Copy files to assets
      run: |
        echo "📦 Copiando arquivos para assets..."
        mkdir -p android/app/src/main/assets
        
        # Copiar arquivos principais
        if [ -f servidor_auto.py ]; then
          cp servidor_auto.py android/app/src/main/assets/
          echo "✅ servidor_auto.py copiado"
        else
          echo "⚠️  servidor_auto.py não encontrado"
        fi
        
        if [ -f iniciar_auto.sh ]; then
          cp iniciar_auto.sh android/app/src/main/assets/
          echo "✅ iniciar_auto.sh copiado"
        else
          echo "⚠️  iniciar_auto.sh não encontrado"
        fi
        
        if [ -f parar.sh ]; then
          cp parar.sh android/app/src/main/assets/
          echo "✅ parar.sh copiado"
        else
          echo "⚠️  parar.sh não encontrado"
        fi
        
        if [ -f INSTALAR_AUTO.sh ]; then
          cp INSTALAR_AUTO.sh android/app/src/main/assets/
          echo "✅ INSTALAR_AUTO.sh copiado"
        else
          echo "⚠️  INSTALAR_AUTO.sh não encontrado"
        fi
        
        if [ -f setup_boot.sh ]; then
          cp setup_boot.sh android/app/src/main/assets/
          echo "✅ setup_boot.sh copiado"
        else
          echo "⚠️  setup_boot.sh não encontrado"
        fi
        
        if [ -f requirements.txt ]; then
          cp requirements.txt android/app/src/main/assets/
          echo "✅ requirements.txt copiado"
        else
          echo "⚠️  requirements.txt não encontrado"
        fi
        
        if [ -f testar_servidor.sh ]; then
          cp testar_servidor.sh android/app/src/main/assets/
          echo "✅ testar_servidor.sh copiado"
        else
          echo "⚠️  testar_servidor.sh não encontrado"
        fi
        
        echo ""
        echo "📋 Arquivos em assets:"
        ls -lh android/app/src/main/assets/
        
    - name: Grant execute permission
      run: |
        echo "🔧 Dando permissão de execução aos scripts..."
        chmod +x android/app/src/main/assets/*.sh 2>/dev/null || true
        ls -l android/app/src/main/assets/*.sh 2>/dev/null || echo "Nenhum script .sh encontrado"
      
    - name: Create Gradle wrapper
      working-directory: android
      run: |
        echo "📦 Criando Gradle wrapper..."
        # Usar --no-validate para pular validação da URL
        gradle wrapper --gradle-version 8.9 --distribution-type bin --no-validate || {
          echo "⚠️  Primeira tentativa falhou, tentando sem validação..."
          # Criar manualmente se falhar
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
          # Usar gradle diretamente para criar o wrapper
          gradle wrapper --gradle-version 8.9
        }
        
    - name: Build Debug APK
      working-directory: android
      run: |
        echo "🔨 Compilando APK Debug..."
        ./gradlew assembleDebug --stacktrace
        
    - name: Build Release APK
      working-directory: android
      run: |
        echo "🔨 Compilando APK Release..."
        ./gradlew assembleRelease --stacktrace
        
    - name: List APK files
      run: |
        echo "📦 Arquivos APK gerados:"
        find android/app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
        
    - name: APK Info
      run: |
        echo "📱 Informações do APK Debug:"
        if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "✅ APK Debug gerado com sucesso!"
        else
          echo "❌ APK Debug não encontrado"
        fi
        
        echo ""
        echo "📱 Informações do APK Release:"
        if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          echo "✅ APK Release gerado com sucesso!"
        else
          echo "❌ APK Release não encontrado"
        fi

